<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 352" width="800" height="352" role="img"
     aria-label="Registration derives each reserve's coin id from its grandparent and the reserve launcher's puzzle hash, then asserts a coin announcement that only a coin running the launcher can make, so a reserve that was never funded cannot be registered.">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6675"/>
    </marker>
    <marker id="bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6b59"/>
    </marker>
    <marker id="bo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c6a2f"/>
    </marker>
  </defs>
  <rect width="800" height="352" fill="#f7f8fa"/>
  <g font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f2430">

    <text x="24" y="28" font-size="11" fill="#5d6675" letter-spacing="1.2">ONE LINEAGE, PER RESERVE, INSIDE THE REGISTRATION BUNDLE</text>

    <rect x="24" y="44" width="196" height="60" rx="3" fill="#ffffff" stroke="#7a8394" stroke-width="1.5"/>
    <text x="122" y="70" font-size="12.5" font-weight="bold" text-anchor="middle">Grandparent</text>
    <text x="122" y="88" font-size="11" fill="#5d6675" text-anchor="middle">the creator's funding coin</text>

    <rect x="292" y="44" width="216" height="60" rx="3" fill="#ffffff" stroke="#7a8394" stroke-width="1.5"/>
    <text x="400" y="66" font-size="12.5" font-weight="bold" text-anchor="middle">Reserve launcher</text>
    <text x="400" y="83" font-size="11" fill="#5d6675" text-anchor="middle">creates one coin at the hash it</text>
    <text x="400" y="97" font-size="11" fill="#5d6675" text-anchor="middle">is given, for its whole amount</text>

    <rect x="580" y="44" width="196" height="60" rx="3" fill="#e9f2ef" stroke="#2d6b59" stroke-width="1.5"/>
    <text x="678" y="70" font-size="12.5" font-weight="bold" text-anchor="middle">Reserve coin</text>
    <text x="678" y="88" font-size="11" fill="#2d6b59" text-anchor="middle">hinted with the launcher id</text>

    <line x1="220" y1="74" x2="288" y2="74" stroke="#5d6675" stroke-width="1.5" marker-end="url(#b)"/>
    <text x="254" y="66" font-size="10.5" fill="#5d6675" text-anchor="middle">creates</text>
    <line x1="508" y1="74" x2="576" y2="74" stroke="#5d6675" stroke-width="1.5" marker-end="url(#b)"/>
    <text x="542" y="66" font-size="10.5" fill="#5d6675" text-anchor="middle">creates</text>

    <rect x="292" y="140" width="216" height="42" rx="3" fill="#fdf6ec" stroke="#8c6a2f" stroke-width="1.4"/>
    <text x="400" y="158" font-size="11" font-weight="bold" text-anchor="middle" fill="#8c6a2f">CreateCoinAnnouncement</text>
    <text x="400" y="174" font-size="10.5" text-anchor="middle" fill="#8c6a2f" font-family="DejaVu Sans Mono, Consolas, monospace">"forge-reserve-v14" ...</text>
    <line x1="400" y1="104" x2="400" y2="136" stroke="#8c6a2f" stroke-width="1.4" marker-end="url(#bo)"/>

    <rect x="120" y="226" width="560" height="94" rx="3" fill="#ffffff" stroke="#2d6b59" stroke-width="1.8"/>
    <text x="400" y="249" font-size="12.5" font-weight="bold" text-anchor="middle">register, in the same transaction</text>
    <text x="400" y="274" font-size="11.5" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace">P_i = coinid(grandparent_i, launcher_hash_i, reserves[i])</text>
    <text x="400" y="297" font-size="11" fill="#2d6b59" text-anchor="middle" font-weight="bold">then asserts the coin announcement from P_i</text>
    <text x="400" y="312" font-size="10.5" fill="#5d6675" text-anchor="middle">the grandparent is given; the reserve's own id is never named</text>

    <line x1="430" y1="226" x2="430" y2="186" stroke="#2d6b59" stroke-width="1.8" marker-end="url(#bg)"/>
    <text x="440" y="210" font-size="10.5" fill="#2d6b59">asserts</text>

    <text x="24" y="336" font-size="10.5" fill="#5d6675">A coin id commits to its puzzle hash, so the only coin that can make that</text>
    <text x="24" y="349" font-size="10.5" fill="#5d6675">announcement is one running the launcher, and the launcher does nothing else.</text>
  </g>
</svg>
